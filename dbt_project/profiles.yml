pulseboard:
  target: dev
  outputs:
    dev:
      type: postgres
      host:     "{{ env_var('DB_HOST', 'localhost') }}"
      port:     "{{ env_var('DB_PORT', '5432') | int }}"
      dbname:   "{{ env_var('DB_NAME', 'pulseboard') }}"
      user:     "{{ env_var('DB_USER', 'pulse') }}"
      password: "{{ env_var('DB_PASSWORD', 'pulse') }}"
      schema:   staging
      threads:  4
      keepalives_idle: 0
      connect_timeout: 10
      search_path: "raw,staging,marts,public"

    ci:
      type: postgres
      host:     "{{ env_var('DB_HOST') }}"
      port:     "{{ env_var('DB_PORT', '5432') | int }}"
      dbname:   "{{ env_var('DB_NAME') }}"
      user:     "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      schema:   staging
      threads:  2
